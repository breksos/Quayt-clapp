name: Build

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  manifest:
    name: Manifest validation
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          submodules: recursive
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22.14.0
          cache: npm
      - run: npm ci
      - run: npm run validate:manifest

  acceptance:
    name: Phase 2 acceptance contract
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          submodules: recursive
      - run: python3 qa/phase2_acceptance.py

  web:
    name: Web frontend
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          submodules: recursive
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22.14.0
          cache: npm
      - run: npm ci
      - run: npm run build:web

  rust:
    name: Rust clapp
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          submodules: recursive
      - uses: dtolnay/rust-toolchain@1.85.1
        with:
          toolchain: 1.85.1
          components: rustfmt
      - run: sudo apt-get update && sudo apt-get install --yes libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev
      - run: cargo fetch --manifest-path src-tauri/Cargo.toml --locked
      - run: cargo fmt --manifest-path src-tauri/Cargo.toml --check
      - run: cargo build --manifest-path src-tauri/Cargo.toml --locked
      - run: cargo test --manifest-path src-tauri/Cargo.toml --locked

  python:
    name: Python service and PostgreSQL schema
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: postgres:17.5-bookworm
        env:
          POSTGRES_DB: quayt_test
          POSTGRES_PASSWORD: quayt_ci
          POSTGRES_USER: quayt
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U quayt -d quayt_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      QUAYT_DATABASE_URL: postgresql+psycopg://quayt:quayt_ci@127.0.0.1:5432/quayt_test
    defaults:
      run:
        working-directory: service
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.4.0
        with:
          python-version: 3.11.11
          cache: pip
          cache-dependency-path: service/requirements.lock
      - run: python -m pip install --upgrade pip==25.0.1
      - run: python -m pip install -r requirements.lock
      - run: python -m pip install -e '.[dev]' --no-deps
      - run: ruff format --check .
      - run: ruff check .
      - run: mypy
      - run: alembic upgrade head
      - run: alembic check
      - run: pytest
